<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HST · Ход проверки</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5edf2;background:#10191e;color-scheme:dark}body{max-width:1080px;margin:auto;padding:32px}h1{font-size:30px;margin:8px 0}h2{font-size:19px}p{line-height:1.55}small,.muted{color:#98b2bc}.top{display:flex;gap:20px;align-items:baseline;justify-content:space-between}progress{width:100%;height:18px;accent-color:#74e4a5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section,.phase{background:#19282f;border:1px solid #304750;border-radius:12px;padding:18px;margin-top:12px}.phase{display:flex;gap:14px;align-items:baseline}.phase>div{flex:1}.phase p{margin:6px 0 0;font-size:14px}.badge{font-size:12px;color:#98b2bc;white-space:nowrap}.running{border-color:#74e4a5}.waiting_user,.error{border-color:#ffba73}.completed .badge{color:#74e4a5}a{color:#89d7ff}details{border-top:1px solid #304750;padding:12px 0;overflow-wrap:anywhere}summary{cursor:pointer}.event{margin:10px 0;border-left:2px solid #46616b;padding-left:12px;font-size:14px}#connection{color:#ffba73}#artifacts{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:18px}.top{display:block}}
</style>
<header><small>HYPOTHESIS STRESS TEST</small><div class="top"><h1>Ход проверки</h1><span id="run"></span></div><p id="connection">Подключаюсь к журналу…</p><p id="updated" class="muted"></p><progress id="bar" max="10" value="0"></progress><p id="count"></p></header>
<div class="grid"><div><h2>Этапы</h2><div id="phases"></div></div><div><h2>Источники</h2><p class="muted">Запрос, чтение документа и использование в выводах — отдельные события.</p><div id="sources"></div><section><h2>Результаты</h2><div id="artifacts"></div></section><section><h2>Журнал</h2><div id="events"></div></section></div></div>
<script>
const labels={pending:'Ожидает',running:'Выполняется',waiting_user:'Нужен ваш ответ',completed:'Завершён',error:'Ошибка',invalidated:'Нужно обновить',query_started:'Поиск',found:'Найдено',read:'Прочитано',used:'Использовано',no_results:'Ничего не найдено',partial:'Частично',unavailable:'Недоступен',auth_error:'Ошибка доступа',waiting_approval:'Ожидает разрешения',declined:'Исключён пользователем'};
const channels={local:'База знаний',confluence:'Confluence',internet:'Интернет'};
const $=s=>document.getElementById(s);
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;return n}
function time(s){return s?new Date(s).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК':'Нет событий'}
function link(url,title){try{const u=new URL(url,location.href);if(!['http:','https:'].includes(u.protocol))return el('span',title);const a=el('a',title);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return el('span',title)}}
function render(data){$('run').textContent=data.run;$('bar').max=data.total;$('bar').value=data.completed;$('count').textContent=`Завершено ${data.completed} из ${data.total} этапов`;$('updated').textContent='Последнее событие: '+time(data.updated_at);
 $('phases').replaceChildren(...data.phases.map(p=>{const n=el('div','',`phase ${p.state}`);const b=el('div');b.append(el('strong',p.name));if(p.message)b.append(el('p',p.message));n.append(b,el('span',labels[p.state]||p.state,'badge'));return n}));
 const all=data.events.filter(e=>e.kind==='source');$('sources').replaceChildren(...Object.entries(channels).map(([key,title])=>{const rows=all.filter(e=>e.channel===key),d=el('details');d.append(el('summary',title+' · '+(rows.length?labels[rows.at(-1).state]||rows.at(-1).state:'Обращений не зафиксировано')));for(const e of rows){const n=el('div','', 'event');n.append(el('small',time(e.at)),el('p',(labels[e.state]||e.state)+': '+e.message));if(e.query)n.append(el('p','Запрос: '+e.query));for(const u of e.urls||[])n.append(link(u,u),el('br'));d.append(n)}return d}));
 $('events').replaceChildren(...data.events.slice(-80).reverse().map(e=>{const n=el('div','', 'event');n.append(el('small',time(e.at)),el('p',(labels[e.state]||e.state)+' · '+e.message));return n}));
}
const artifacts=[['discovery_preview.md','Обзор источников'],['evidence_inventory.md','Собранные данные'],['external_research.md','Внешнее исследование'],['human_report.html','Итоговый отчёт']];
async function tick(){try{if(location.protocol==='file:')throw Error('Откройте адрес http://127.0.0.1, который выдал run_progress.py serve. Чтение file:// не поддерживает живое обновление.');const r=await fetch('progress.json',{cache:'no-store'});if(!r.ok)throw Error('Журнал недоступен');const d=await r.json();render(d);const age=d.updated_at?(Date.now()-new Date(d.updated_at))/1000:0;$('connection').textContent=age>180?'Новых событий более 3 минут. Проверьте Cline: работа могла продолжаться, ожидать ответа или прерваться.':'Связь с журналом есть · обновление каждые 2 секунды';const links=await Promise.all(artifacts.map(async([p,t])=>{try{const r=await fetch(p,{method:'HEAD',cache:'no-store'});return r.ok?link(p,t):null}catch{return null}}));$('artifacts').replaceChildren(...links.filter(Boolean));}catch(e){$('connection').textContent=e.message+' Последние показанные данные могут быть устаревшими.'}finally{setTimeout(tick,2000)}}tick();
</script></html>
