<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HST · Ход проверки</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5edf2;background:#10191e;color-scheme:dark}
*{box-sizing:border-box}body{max-width:1240px;margin:auto;padding:28px}
h1{font-size:28px;margin:8px 0}h2{font-size:17px;margin:0 0 12px}p{line-height:1.5}
small,.muted{color:#98b2bc}.top{display:flex;gap:20px;align-items:baseline;justify-content:space-between}
progress{width:100%;height:12px;accent-color:#74e4a5}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:28px;margin-top:24px;align-items:start}
.grid>div{min-width:0}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.log{font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;border-top:1px solid #304750}
.log-row{display:grid;grid-template-columns:66px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid #253840;overflow-wrap:anywhere}
.log-time{color:#819aa5;white-space:nowrap}.log-state{color:#b8cbd2}.log-context{color:#81b6c8}.log-message{color:#dce6eb}
.state-running .log-state,.state-completed .log-state,.state-read .log-state,.state-used .log-state{color:#74e4a5}
.state-error .log-state,.state-auth_error .log-state,.state-waiting_user .log-state,.state-waiting_approval .log-state{color:#ffba73}
.phase{border-top:1px solid #304750;padding:12px 0;display:flex;gap:12px;align-items:baseline}
.phase>div{flex:1;min-width:0}.phase strong{font-size:14px}.phase p{margin:6px 0 0;font-size:12px;color:#98b2bc;overflow-wrap:anywhere}
.badge{font-size:11px;color:#98b2bc;white-space:nowrap}.completed .badge{color:#74e4a5}.running .badge{color:#89d7ff}.waiting_user .badge,.error .badge{color:#ffba73}
section{margin-top:28px}a{color:#89d7ff}details{border-top:1px solid #304750;padding:10px 0;overflow-wrap:anywhere}summary{cursor:pointer;font-size:13px}
.source-event{font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;padding:8px 0;border-bottom:1px solid #253840}.source-event p{margin:4px 0}
#connection{color:#ffba73;font-size:13px}#updated,#count{font-size:12px}#artifacts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:1fr;gap:24px}body{padding:16px}.top{display:block}.badge{white-space:normal;text-align:right}}
</style>
<header>
 <small>HYPOTHESIS STRESS TEST</small>
 <div class="top"><h1>Ход проверки</h1><span id="run"></span></div>
 <p id="connection">Подключаюсь к журналу…</p><p id="updated" class="muted"></p>
 <p id="warnings" style="color:#ffba73;white-space:pre-line"></p>
 <progress id="bar" max="10" value="0"></progress><p id="count"></p>
</header>
<div class="grid">
 <div>
  <div class="heading"><h2>Журнал</h2><small id="log-count">Новые события сверху · МСК</small></div>
  <div id="events" class="log"></div>
 </div>
 <div>
  <div class="heading"><h2>Этапы</h2><small>Последние обновления сверху</small></div>
  <div id="phases"></div>
  <section><h2>Источники</h2><div id="sources"></div></section>
  <section><h2>Результаты</h2><div id="artifacts"></div></section>
 </div>
</div>
<script>
const labels={pending:'Ожидает',running:'Выполняется',waiting_user:'Нужен ваш ответ',completed:'Завершён',error:'Ошибка',invalidated:'Нужно обновить',query_started:'Поиск',found:'Найдено',read:'Прочитано',used:'Использовано',no_results:'Ничего не найдено',partial:'Частично',unavailable:'Недоступен',auth_error:'Ошибка доступа',waiting_approval:'Ожидает разрешения',declined:'Исключён пользователем'};
const channels={local:'База знаний',confluence:'Confluence',internet:'Интернет'};
const $=s=>document.getElementById(s);
function el(tag,text,cls){const n=document.createElement(tag);n.textContent=text||'';if(cls)n.className=cls;return n}
function time(s){return s?new Date(s).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' МСК':'Нет событий'}
function clock(s){return s?new Date(s).toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—'}
function link(url,title){try{const u=new URL(url,location.href);if(!['http:','https:'].includes(u.protocol))return el('span',title);const a=el('a',title);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';return a}catch{return el('span',title)}}
function recent(rows){return rows.map((row,index)=>({row,index})).sort((a,b)=>(Date.parse(b.row.at)||0)-(Date.parse(a.row.at)||0)||b.index-a.index).map(x=>x.row)}
function phaseOrder(phases,events){
 const last=new Map();events.forEach((e,i)=>{if(e.kind==='phase')last.set(e.phase,i)});
 return phases.map((row,index)=>({row,index})).sort((a,b)=>{
  const datedA=Boolean(a.row.at),datedB=Boolean(b.row.at);
  if(datedA!==datedB)return datedB-datedA;
  if(!datedA)return a.index-b.index;
  return (Date.parse(b.row.at)||0)-(Date.parse(a.row.at)||0)||(last.get(b.row.id)??-1)-(last.get(a.row.id)??-1);
 }).map(x=>x.row);
}
function render(data){
 $('warnings').textContent=(data.warnings||[]).join('\n');
 $('run').textContent=data.run;$('bar').max=data.total;$('bar').value=data.completed;
 $('count').textContent=`Завершено ${data.completed} из ${data.total} этапов`;
 $('updated').textContent='Последнее событие: '+time(data.updated_at);
 $('phases').replaceChildren(...phaseOrder(data.phases,data.events).map(p=>{
  const n=el('div','',`phase ${p.state}`),b=el('div');b.append(el('strong',p.name));
  if(p.message)b.append(el('p',p.message));n.append(b,el('span',labels[p.state]||p.state,'badge'));return n;
 }));
 const all=data.events.filter(e=>e.kind==='source');
 const open=new Set([...$('sources').querySelectorAll('details[open]')].map(d=>d.dataset.channel));
 $('sources').replaceChildren(...Object.entries(channels).map(([key,title])=>{
  const rows=recent(all.filter(e=>e.channel===key)),d=el('details');d.dataset.channel=key;d.id='source-'+key;d.open=open.has(key)||location.hash==='#source-'+key;
  const selection=data.source_selection,enabled=selection?.channels?.[key];
  const status=enabled===false?'Отключён пользователем':data.source_selection_required&&!selection?.confirmed?'Ожидает выбора':rows.length&&!(enabled&&rows[0].state==='declined')?(labels[rows[0].state]||rows[0].state):enabled?'Ожидает проверки':'Обращений не зафиксировано';
  d.append(el('summary',title+' · '+status));
  for(const e of rows){const n=el('div','','source-event');n.append(el('small',time(e.at)),el('p',(labels[e.state]||e.state)+': '+e.message));
   if(e.query)n.append(el('p','Запрос: '+e.query));for(const u of e.urls||[])n.append(link(u,u),el('br'));d.append(n)}return d;
 }));
 const names=new Map(data.phases.map(p=>[p.id,p.name]));
 const rows=recent(data.events).slice(0,80);
 $('log-count').textContent=(data.events.length>80?`Последние 80 из ${data.events.length} · `:'')+'Новые сверху · МСК';
 $('events').replaceChildren(...rows.map(e=>{
  const n=el('div','',`log-row state-${e.state}`),stamp=el('time',clock(e.at),'log-time');stamp.dateTime=e.at;stamp.title=time(e.at);
  const text=el('div');text.append(el('span','['+(labels[e.state]||e.state)+'] ','log-state'),el('span',(channels[e.channel]||names.get(e.phase)||e.phase)+' · ','log-context'),el('span',e.message,'log-message'));
  n.append(stamp,text);return n;
 }));
}
window.addEventListener('hashchange',()=>{const target=document.getElementById(location.hash.slice(1));if(target?.tagName==='DETAILS'){target.open=true;target.scrollIntoView({block:'nearest'})}});
const artifacts=[['discovery_preview.md','Обзор источников'],['evidence_inventory.md','Собранные данные'],['external_research.md','Внешнее исследование'],['human_report.html','Итоговый отчёт']];
async function tick(){try{if(location.protocol==='file:')throw Error('Откройте адрес http://127.0.0.1, который выдал run_progress.py serve. Чтение file:// не поддерживает живое обновление.');const r=await fetch('progress.json',{cache:'no-store'});if(!r.ok)throw Error('Журнал недоступен');const d=await r.json();render(d);const age=d.updated_at?(Date.now()-new Date(d.updated_at))/1000:0;$('connection').textContent=age>180?'Новых событий более 3 минут. Проверьте Cline: работа могла продолжаться, ожидать ответа или прерваться.':'Связь с журналом есть · обновление каждые 2 секунды';const links=await Promise.all(artifacts.map(async([p,t])=>{try{const r=await fetch(p,{method:'HEAD',cache:'no-store'});return r.ok?link(p,t):null}catch{return null}}));$('artifacts').replaceChildren(...links.filter(Boolean));}catch(e){$('connection').textContent=e.message+' Последние показанные данные могут быть устаревшими.'}finally{setTimeout(tick,2000)}}tick();
</script>
</html>
