name: Framework contracts
on: [push, pull_request]
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py
      - name: Require the next minor version for every PR
        if: github.event_name == 'pull_request'
        env:
          HST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_version.py --base "$HST_BASE_SHA"
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        readers: [core, documents, terminal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document readers
        if: matrix.readers != 'core'
        run: python -m pip install -r requirements-evidence.txt
      - name: Install optional terminal viewer
        if: matrix.readers == 'terminal'
        run: python -m pip install -r requirements-terminal.txt
      - run: python scripts/validate_runs.py --examples
      - run: python -m unittest discover -s tests -v
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_updater.py -v

  tui-control:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_tui_control.py -v
      - run: node --test integrations/vscode-bridge/protocol.test.js
