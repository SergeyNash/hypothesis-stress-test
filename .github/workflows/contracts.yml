name: Documentation and Progress Task
on: [push, pull_request]
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py
      - name: Next minor version
        if: github.event_name == 'pull_request'
        env:
          HST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_version.py --base "$HST_BASE_SHA"
  maintenance-and-progress:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-terminal.txt
      - run: python -m unittest discover -s tests -v
