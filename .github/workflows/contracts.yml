name: Framework contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        readers: [core, documents]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document readers
        if: matrix.readers == 'documents'
        run: python -m pip install -r requirements-evidence.txt
      - run: python scripts/validate_runs.py --examples
      - run: python -m unittest discover -s tests -v
